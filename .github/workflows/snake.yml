# Place at: .github/workflows/snake.yml  in your Rajveer-code/Rajveer-code repo.
# Generates the contribution-snake SVG the README embeds. After adding this file,
# go to the repo's Actions tab and run it once manually (Run workflow) to create
# the `output` branch; it then auto-refreshes every 12 hours.
name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=576cbc&color_dots=#161b22,#1f6feb,#388bfd,#58a6ff,#79c0ff

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
